<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="Tools I use. Grouped by the job they do">
<title>Tools I use. Grouped by the job they do</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dot { animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
</style>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </linearGradient></defs>

  <circle cx="10" cy="30" r="5" fill="#0891B2" class="dot"/>
  <text x="26" y="37" class="mono" font-size="15" letter-spacing="2" fill="#0891B2">04</text>
  <text x="60" y="38" class="sans" font-size="28" font-weight="700" fill="#0F172A">Tools I use</text>
  <text x="62" y="62" class="sans" font-size="15" fill="#475569">Grouped by the job they do</text>
  <rect x="0" y="73" width="1200" height="3" rx="1.5" fill="url(#brand)" class="bar"/>

</svg>
