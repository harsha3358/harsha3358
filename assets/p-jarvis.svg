<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="MARK XL · JARVIS: A voice assistant that runs fully on your own computer. Listens, thinks, acts. No cloud. Built with Whisper, Ollama, tool calling, TTS.">
<title>MARK XL · JARVIS: A voice assistant that runs fully on your own computer. Listens, thinks, acts. No cloud. Built with Whisper, Ollama, tool calling, TTS.</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .sweep { animation: sweep 4s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-200px); } 60%,100% { transform: translateX(780px); } }
  .live { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060A13"/><stop offset="1" stop-color="#0B1222"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="brandShift" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.35" stop-color="#818CF8"/>
    <stop offset="0.65" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
  </pattern>
  <clipPath id="round"><rect width="580" height="250" rx="18"/></clipPath>

  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient></defs>
<g clip-path="url(#round)">
  <rect width="580" height="250" fill="url(#bg)"/>
  <rect width="580" height="250" fill="url(#grid)"/>
  
  <rect width="580" height="4" fill="url(#accent)"/>
  <rect x="0" y="0" width="160" height="4" fill="url(#shine)" class="sweep" opacity=".8"/>
  <rect x="28" y="30" width="91" height="26" rx="6" fill="#C084FC" fill-opacity=".14" stroke="#C084FC" stroke-opacity=".5"/>
  <text x="40" y="48" class="mono" font-size="12" letter-spacing="1.5" font-weight="700" fill="#C084FC">LOCAL AI</text>
  <rect x="427" y="30" width="125" height="26" rx="13" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/>
  <circle cx="442" cy="43" r="4" fill="#FBBF24" class="live"/>
  <text x="452" y="47.5" class="mono" font-size="12" fill="#FBBF24">Private repo</text>
  <text x="28" y="94" class="sans" font-size="26" font-weight="700" fill="#F1F5F9">MARK XL · JARVIS</text>
  <text x="28" y="124" class="sans" font-size="16" fill="#CBD5E1">A voice assistant that runs fully on your own</text><text x="28" y="148" class="sans" font-size="16" fill="#CBD5E1">computer. Listens, thinks, acts. No cloud.</text>
  <rect x="28" y="196" width="74" height="28" rx="14" fill="#0B1222" stroke="#334155"/><text x="65" y="215" class="mono" font-size="12" fill="#CBD5E1" text-anchor="middle">Whisper</text><rect x="109.80000000000001" y="196" width="66" height="28" rx="14" fill="#0B1222" stroke="#334155"/><text x="143" y="215" class="mono" font-size="12" fill="#CBD5E1" text-anchor="middle">Ollama</text><rect x="184.20000000000002" y="196" width="111" height="28" rx="14" fill="#0B1222" stroke="#334155"/><text x="240" y="215" class="mono" font-size="12" fill="#CBD5E1" text-anchor="middle">tool calling</text><rect x="303.0" y="196" width="44" height="28" rx="14" fill="#0B1222" stroke="#334155"/><text x="325" y="215" class="mono" font-size="12" fill="#CBD5E1" text-anchor="middle">TTS</text>

</g>
<rect x="0.5" y="0.5" width="579" height="249" rx="18" fill="none" stroke="#334155"/>
</svg>
