<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Harshavardhan Reddy, AI Engineer and Data Engineer. I build data pipelines and AI systems that run on their own.">
<title>Harshavardhan Reddy, AI Engineer and Data Engineer. I build data pipelines and AI systems that run on their own.</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .edge { stroke: #334155; stroke-width: 1; opacity: .55; fill: none; }
  .pulse { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 9 91;
           animation: flow linear infinite; }
  @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  .halo { opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
  @keyframes halo { 0% { opacity: .45; transform: scale(.4); } 70%,100% { opacity: 0; transform: scale(1.35); } }
  .packet { opacity: 0; animation: packet 3.3s linear infinite; }
  @keyframes packet { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; }
                       85% { opacity: 1; } 100% { opacity: 0; transform: translateX(128px); } }
  .step { opacity: .25; animation: step 3.5s ease-in-out infinite; }
  @keyframes step { 0%,100% { opacity: .3; } 20%,60% { opacity: 1; } }
  .type { transform-box: fill-box; transform-origin: left; animation: type 2.4s steps(40) .3s both; }
  @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .glow { animation: glow 5s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060A13"/><stop offset="1" stop-color="#0B1222"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="brandShift" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="0.35" stop-color="#818CF8"/>
    <stop offset="0.65" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
  </pattern>
  <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>

  <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <clipPath id="typeClip"><rect class="type" x="64" y="186" width="620" height="60"/></clipPath>
</defs>
