    <text x="62" y="156" class="sans" font-size="54" font-weight="800" fill="url(#brandShift)">Harshavardhan Reddy</text>
  </g>
  <g clip-path="url(#typeClip)">
    <text x="64" y="204" class="sans" font-size="21" fill="#F1F5F9">I build data pipelines and AI systems that run on their own.</text>
    <text x="64" y="234" class="sans" font-size="17" fill="#94A3B8">Raw data in, working product out: collect, clean, store, model, ship.</text>
  </g>
